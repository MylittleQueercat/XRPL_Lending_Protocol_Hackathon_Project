services:
  web:
    image: raise-web:${RAISE_IMAGE_TAG:?Set an immutable release tag, normally the Git commit}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      RAISE_MARKET_ORIGIN: https://${RAISE_DOMAIN:?Set the public hostname without scheme or path}
      RAISE_MARKET_DB_PATH: /data/market.sqlite
    volumes:
      - market-data:/data
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Public routing is managed by this service's Dokploy Domains entry.

volumes:
  market-data:
    # Stable across code releases; never remove this volume during a rollback.
    name: ${RAISE_VOLUME_NAME:?Set a stable unique volume name for this deployment}

networks:
  dokploy-network:
    external: true
